services:
  ollama:
    image: chat-summary-ollama:latest
    pull_policy: never
    ports:
      - "11434:11434"

  api:
    image: chat-summary:release
    pull_policy: never
    profiles: ["release"]
    ports:
      - "${WEBSOCKET_PORT:-3000}:${WEBSOCKET_PORT:-3000}"
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      - ollama
      - jaeger
      - qdrant
    env_file:
      - .env
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OTEL_SERVICE_NAME=chat-summary

  api-debug:
    image: chat-summary:debug
    pull_policy: never
    profiles: ["debug"]
    ports:
      - "${WEBSOCKET_PORT:-3000}:${WEBSOCKET_PORT:-3000}"
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      - ollama
      - jaeger
      - qdrant
    env_file:
      - .env
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OTEL_SERVICE_NAME=chat-summary

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"

  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["release", "debug"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
