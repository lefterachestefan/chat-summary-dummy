[package]
name = "chat-summary"
version = "0.4.0"
edition = "2024"
rust-version = "1.96.0"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["form", "json", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
futures = "0.3.32"
dotenvy = "0.15.7"
uuid = { version = "1.23.4", features = ["v4"] }
actix-web = "4.14.0"
actix-multipart = "0.8.0"
actix-files = "0.6.10"
actix-ws = "0.4.0"
fastembed = "5.17.2"
qdrant-client = "1.18.0"
anyhow = "1.0.103"
chrono = "0.4.45"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.18", features = [
	"env-filter",
	"fmt",
	"registry",
] }
tracing-opentelemetry = "0.33.0"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
crawler = { path = "crawler" }
thiserror = "2.0.19"

[workspace]
members = ["crawler"]

[profile.release]
lto = true

[dev-dependencies]
tokio-tungstenite = "0.30"
wiremock = "0.6"
testcontainers = "0.27.3"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[lints]
workspace = true
