name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo, sccache, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/sccache
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml', 'flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-
            ${{ runner.os }}-cargo-

      - name: Flake check
        run: nix flake check --no-build

      - name: Test and audit
        run: |
          nix develop .#ci -c bash -c '
            set -euo pipefail
            export CARGO_INCREMENTAL=0
            export RUSTC_WRAPPER=sccache
            export SCCACHE_DIR="$GITHUB_WORKSPACE/.cache/sccache"
            export SCCACHE_CACHE_SIZE=10G

            cargo test --workspace -- --skip test_full_integration_pipeline
            cargo audit
            sccache --show-stats
          '
